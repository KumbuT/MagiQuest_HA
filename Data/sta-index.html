<!doctypehtml>
    <title>Device Setup</title>
    <meta content="width=device-width,initial-scale=1" name=viewport>

    <head>
        <style>
            body {
                color: #fff;
                background-color: #141414;
                font-family: Helvetica, Verdana, Arial, sans-serif
            }

            h1 {
                text-align: center
            }

            p {
                text-align: center
            }

            div {
                margin: 5%;
                background-color: #242424;
                padding: 10px;
                border-radius: 8px
            }

            br {
                display: block;
                margin: 10px 0;
                line-height: 22px;
                content: " "
            }

            label {
                text-align: center;
                padding: 2%
            }

            input,
            select {
                border-radius: 4px;
                border: 2px solid #0056a8;
                width: 90%;
                padding: 10px;
                display: block;
                margin-right: auto;
                margin-left: auto
            }

            input[type=submit] {
                font-size: 25px;
                background-color: #0056a8;
                color: #fff;
                border-radius: 8px;
                height: 50px;
                width: 95%
            }

            button {
                background-color: #0056a8;
                color: #fff;
                border-radius: 4px;
                display: block;
                width: auto;
                margin-right: auto;
                margin-left: auto;
            }
        </style>
        <script src="/jquery-3.7.1.min.js"></script>
        <script>
            $(document).ready(function () {
                $("#showpassword").on('click', function () {
                    if ($(this).is(':checked')) {
                        $("#wifipass").attr('type', 'text');
                    } else {
                        $("#wifipass").attr('type', 'password');
                    }

                });

                $("#testtoken").on('click', function () {
                    if ($("#haurl").val().length == 0) { alert("Please enter Home Assistant URL"); }
                    else {
                        $.ajaxSetup({
                            headers: {
                                'Authorization': "Bearer " + $("#token").val(),
                                'Content-Type': 'application/json'
                            }
                        });
                        $.get($("#haurl").val() + '/api/', function (data, status, xhr) {
                            console.log(status);
                            console.log(data);
                            if (status == "success") {
                                alert("Token Valid: " + JSON.stringify(data));
                            } else {
                                alert("Token or Home Assistant URL is invalid");
                            }
                        }).fail(function (err) {
                            alert("Token or URL invalid");
                            console.log(err);

                        });
                    }
                });

                $.getJSON("/getconfigs", function (data, status, xhr) {
                    //alert(data);
                    //let networks = $.parseJSON(data);
                    $("#wifissid").val(data.ssid);
                    $("#wifipass").val(data.password);
                    $("#token").val(data.token);
                    $("#haurl").val(data.haurl);
                    $("#hostname").val(data.hostname);
                    $("#MAC").val(data.MAC);
                });
            });
        </script>
    </head>

    <body>
        <div>
            <h1>Device Settings</h1>
            <form action="/savesettings">
                <h2><label>Device Settings</label></h2>
                <label>Device Name</label>
                <input id=hostname name=hostname />
                <label>Device MAC</label>
                <input id=MAC name=MAC readonly="readonly" />
                <h2><label>Wi-Fi Settings</label></h2>
                <br>
                <label>SSID</label>
                <input id=wifissid name=wifissid readonly="readonly" />
                <br>
                <label>Wi-Fi Password</label>
                <input id=wifipass name=wifipass placeholder="Wi-Fi Password" type="password" readonly="readonly" />
                <input type="checkbox" name="showpassword" id="showpassword">Show Password</input>
                <h2>
                    <label>Home Assistant Settings</label>
                </h2>
                <br>
                <label>Access Token</label>
                <input id="token" name="token" placeholder="bearer token" />
                <br>
                <button type="button" id="testtoken" value="Test Token"> Test Token </button>
                <br>
                <label>Home Assistant URL</label>
                <input id="haurl" name="haurl" placeholder="http://hassio.local:8123" />
                <br>
                <input type=submit value=Submit></input>
                <br>
            </form>
        </div>
    </body>
